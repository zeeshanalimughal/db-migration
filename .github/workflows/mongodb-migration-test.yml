name: MongoDB 7.0 -> 8.3 migration test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mongodb-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    # Same OS as production (Ubuntu 22.04 jammy, x86_64, systemd).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        # bash -eo pipefail: a failing script is not masked by `| tee`.
        shell: bash
    env:
      SOURCE_VERSION: "7.0.42"
      TARGET_VERSION: "8.3.17"
      INTERMEDIATE_VERSION: "8.0.38"
      MONGOT_VERSION: "1.78.0"
    steps:
      - uses: actions/checkout@v5

      - name: Generate credentials (masked)
        run: |
          ADMIN_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$ADMIN_PW"
          echo "ADMIN_PW=$ADMIN_PW" >> "$GITHUB_ENV"
          echo "MONGO_URI=mongodb://admin:${ADMIN_PW}@127.0.0.1:27017/workmentor?authSource=admin&replicaSet=rs0" >> "$GITHUB_ENV"
          # Same login without a database path, for mongorestore (a path would act as --db).
          echo "TOOLS_URI=mongodb://admin:${ADMIN_PW}@127.0.0.1:27017/?authSource=admin&replicaSet=rs0" >> "$GITHUB_ENV"

      - name: Lint shell scripts
        run: |
          bash -n scripts/migrate-mongodb.sh ci/setup-source-mongodb.sh
          shellcheck -S error scripts/migrate-mongodb.sh ci/setup-source-mongodb.sh

      - name: Provision production-like MongoDB ${{ env.SOURCE_VERSION }} (replica set + keyfile + auth)
        run: sudo -E bash ci/setup-source-mongodb.sh

      - name: Wrong password is rejected
        run: |
          if mongosh --quiet "mongodb://admin:wrong@127.0.0.1:27017/admin?replicaSet=rs0" --eval 'db.runCommand({ping:1})' 2>/dev/null; then
            echo "::error::login with a wrong password succeeded"; exit 1
          fi
          echo "OK authentication is enforced"

      - name: Seed the workmentor database
        run: mongosh --quiet "$MONGO_URI" ci/seed.js

      - name: Query BEFORE migration
        run: mongosh --quiet "$MONGO_URI" ci/query.js

      - name: Check-only run changes nothing
        run: |
          sudo -E env CHECK_ONLY=1 bash scripts/migrate-mongodb.sh | tee check.log
          grep -q "MongoDB was not changed" check.log
          mongosh --quiet "$MONGO_URI" --eval '
            const v = db.version(), f = db.adminCommand({getParameter:1, featureCompatibilityVersion:1}).featureCompatibilityVersion.version;
            print("after CHECK_ONLY: " + v + " FCV " + f);
            if (!v.startsWith("7.0.") || f !== "7.0") quit(1);'
          if [ -n "$(sudo bash -c 'ls -d /var/backups/mongodb-migration/*/dump 2>/dev/null' || true)" ]; then
            echo "::error::CHECK_ONLY created a backup"; exit 1
          fi

      - name: Run the migration script
        # VERIFY_RESTORE=always: the backup must pass a full restore test in CI.
        # MONGOT_MEMORY_MAX: exercise the memory cap recommended for production.
        # COLD_BACKUP=always: the rollback snapshot must be taken (rollback is tested below).
        run: |
          sudo -E env ASSUME_YES=1 STRICT_COUNTS=1 VERIFY_RESTORE=always COLD_BACKUP=always MONGOT_MEMORY_MAX=2G \
            bash scripts/migrate-mongodb.sh | tee migrate.log
          grep -q "Rollback snapshot complete" migrate.log

      - name: Query AFTER migration
        run: mongosh --quiet "$MONGO_URI" ci/query.js

      - name: Verify version, data, auth and $vectorSearch
        run: |
          EXPECT_VERSION="$TARGET_VERSION" mongosh --quiet "$MONGO_URI" ci/verify-after.js
          if [ "$(mongosh --quiet "mongodb://127.0.0.1:27017/?directConnection=true" --eval 'db.adminCommand({listDatabases:1}).ok' 2>/dev/null || true)" = "1" ]; then
            echo "::error::auth no longer enforced after migration"; exit 1
          fi
          grep -q 'cursorTimeoutMillis: 600000' /etc/mongod.conf
          python3 -c 'import yaml; c=yaml.safe_load(open("/etc/mongod.conf")); print("mongod.conf setParameter:", c["setParameter"])'
          systemctl is-enabled mongod mongot
          echo "mongot MemoryMax: $(systemctl show -p MemoryMax --value mongot)"
          [ "$(systemctl show -p MemoryMax --value mongot)" = "2147483648" ]
          curl -fsS http://localhost:27029/health
          apt-mark showhold | grep mongodb-org

      - name: Restore test (backup archive is usable)
        run: |
          ARCHIVE="$(sudo bash -c 'ls -1t /var/backups/mongodb-migration/*/dump/full-backup.archive.gz | head -1')"
          sudo bash -c "cd \$(dirname '$ARCHIVE') && sha256sum -c full-backup.archive.gz.sha256"
          sudo cat "$ARCHIVE" | mongorestore --uri "$TOOLS_URI" --gzip --archive \
            --nsInclude 'workmentor.*' --nsFrom 'workmentor.*' --nsTo 'restorecheck.*'
          mongosh --quiet "$MONGO_URI" --eval '
            const a = db.getSiblingDB("workmentor"), b = db.getSiblingDB("restorecheck");
            for (const c of a.getCollectionNames()) {
              const x = a.getCollection(c).countDocuments(), y = b.getCollection(c).countDocuments();
              print(`${c}: live=${x} restored=${y}`);
              if (x !== y) quit(1);
            }
            b.dropDatabase();'

      - name: Re-run is safe (idempotent, verify-only)
        run: |
          sudo -E env ASSUME_YES=1 STRICT_COUNTS=1 MONGOT_MEMORY_MAX=2G bash scripts/migrate-mongodb.sh | tee rerun.log
          grep -q "mongot already installed" rerun.log
          if grep -q "3. Backup" rerun.log; then echo "::error::re-run took a new backup"; exit 1; fi

      - name: Full rollback to the original version
        # From 8.3.17 / FCV 8.3 with mongot running, back to the source 7.0 server.
        run: |
          sudo -E env ASSUME_YES=1 ROLLBACK=1 bash scripts/migrate-mongodb.sh | tee rollback.log
          grep -q "no data will be lost" rollback.log
          grep -q "Rollback finished successfully" rollback.log

      - name: Verify the rollback (same URI, original version and data)
        run: |
          mongosh --quiet "$MONGO_URI" ci/query.js
          EXPECT_VERSION="$SOURCE_VERSION_USED" mongosh --quiet "$MONGO_URI" ci/verify-rollback.js
          grep -xF "db version v$SOURCE_VERSION_USED" <<<"$(mongod --version)"
          RUN="$(sudo bash -c 'ls -1dt /var/backups/mongodb-migration/*/ | while read d; do [ -f "$d/ROLLBACK.env" ] && { echo "$d"; break; }; done')"
          echo "snapshot run: $RUN"
          sudo cmp /etc/mongod.conf "${RUN}files/mongod.conf"
          echo "OK mongod.conf is byte-identical to the original"
          if grep -q mongotHost /etc/mongod.conf; then echo "::error::search parameters still in mongod.conf"; exit 1; fi
          if systemctl is-active --quiet mongot; then echo "::error::mongot still running"; exit 1; fi
          if [ "$(systemctl is-enabled mongot 2>/dev/null || true)" = "enabled" ]; then echo "::error::mongot still enabled"; exit 1; fi
          echo "OK mongot stopped and disabled"
          sudo bash -c 'ls -d /var/lib/mongodb.before-rollback-*'
          echo "OK replaced dbPath kept aside"
          if [ "$(mongosh --quiet "mongodb://127.0.0.1:27017/?directConnection=true" --eval 'db.adminCommand({listDatabases:1}).ok' 2>/dev/null || true)" = "1" ]; then
            echo "::error::auth not enforced after rollback"; exit 1
          fi
          echo "OK authentication enforced"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p ci-logs
          sudo bash -c 'for d in /var/backups/mongodb-migration/*/; do n=$(basename "$d"); mkdir -p ci-logs/$n; cp "$d"/*.log "$d"/*.json "$d"/*.tsv "$d"/*.diff "$d"/RESTORE.txt ci-logs/$n/ 2>/dev/null; cp "$d"/dump/*.log ci-logs/$n/ 2>/dev/null; mkdir -p ci-logs/$n/restore-test; cp "$d"/restore-test/*.log ci-logs/$n/restore-test/ 2>/dev/null; done; true'
          sudo cp /etc/mongod.conf ci-logs/mongod.conf 2>/dev/null || true
          sudo cp /etc/mongot/mongot.yml ci-logs/mongot.yml 2>/dev/null || true
          sudo bash -c 'ls -la /opt/mongot/current/ 2>&1' > ci-logs/mongot-install-listing.txt || true
          sudo cp /var/log/mongodb/mongod.log ci-logs/ 2>/dev/null || true
          sudo journalctl -u mongot --no-pager > ci-logs/mongot.journal.log 2>/dev/null || true
          sudo journalctl -u mongod --no-pager > ci-logs/mongod.journal.log 2>/dev/null || true
          sudo chown -R "$USER" ci-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: migration-logs
          path: ci-logs
          retention-days: 7
